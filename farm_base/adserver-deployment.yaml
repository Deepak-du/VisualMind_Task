apiVersion: v1
kind: Service
metadata:
  namespace: adition
  name: ad-svc
  labels:
    app: adserver
spec:
  clusterIP: None
  selector:
    app: adserver
  ports:
  - port: 80
    targetPort: 80

---
apiVersion: apps/v1
kind: StatefulSet                   # Use StatefulSet for stable pod hostnames
metadata:
  namespace: adition
  name: adserver
spec:
  serviceName: ad-svc
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: adserver
  template:
    metadata:
      labels:
        app: adserver
    spec:
      volumes:
      - name: geodata
        persistentVolumeClaim:
          claimName: geodata-pvc
      - name: config
        configMap:
          name: adserver-cfgmap
      containers:
      - name: adserver
        image: my-adserver:v1
        ports:
        - containerPort: 80
        env:
          # Expose pod metadata as environment variables
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        volumeMounts:
          # Mount the geodata volume at the path used by adserver.py (see minikube mount)
          - name: geodata
            mountPath: /mnt/adserver_geodata
          # Mount the configuration volume at the expected config path
          - name: config
            mountPath: /etc/adserver